security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                # No `property:` — UserRepository implements UserLoaderInterface so a login
                # as `Foo@Bar.com` resolves against the stored, normalized `foo@bar.com`.
                class: App\Account\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # FR-009: refuses Inactive and Deleted accounts, and (per configuration) accounts
            # with an unverified email. Runs on every *authentication* — form login and any
            # future authenticator — but NOT when a session is restored from its cookie:
            # ContextListener reloads the user and never calls a user checker. What covers an
            # account deactivated mid-session is User::isEqualTo(); do not remove it on the
            # assumption that this checker sees those requests.
            user_checker: App\Account\Security\AccountStatusChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: account_dashboard
            # FR-003: max_attempts applies per username+IP, and Symfony additionally applies
            # 5x that limit globally per IP — both dimensions the requirement asks for, with
            # no custom limiter. Storage is cache.app, so limits are per-node (see R2).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                # Without this, any third-party page can sign a visitor out with an
                # <img src="/logout">. logout_path()/logout_url() add the token for you, so
                # links built in Twig keep working; anything hand-rolling the URL must not.
                enable_csrf: true
                # where to redirect after logout
                # target: app_any_route

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # FR-028…032. The listener answers `?_switch_user=` on any URL, which is why the
            # rules that matter (no Super Admin target, audit record, expiry) live in
            # App\Account\Security\SwitchUserAuditSubscriber and not in the controller that
            # renders the button.
            # https://symfony.com/doc/current/security/impersonating_user.html
            switch_user: { role: ROLE_ALLOWED_TO_SWITCH }

    # D3: deliberately no hierarchy between the four *business* roles. A Super Admin inheriting
    # ROLE_TRAINER would be routed into organization-scoped views with no organization.
    #
    # ROLE_ALLOWED_TO_SWITCH is not a business role — it is the capability grant `switch_user`
    # checks (FR-028). Granting it here rather than adding it to User::getRoles() keeps the
    # invariant that a user's roles are derived from exactly one stored enum value.
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ALLOWED_TO_SWITCH]

    # Note: Only the *first* matching rule is applied — public routes must come first.
    # FR-010: authorization lives here (and in voters), never in a hidden Twig link.
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/password/forgot, roles: PUBLIC_ACCESS }
        - { path: ^/password/reset, roles: PUBLIC_ACCESS }
        - { path: ^/verify, roles: PUBLIC_ACCESS }
        # FR-042/FR-049: the redemption flow must be reachable by a visitor who has no account
        # yet. Everything it is allowed to do for a *signed-in* visitor is decided per account
        # by RedemptionPlanner, not by this rule.
        - { path: ^/join, roles: PUBLIC_ACCESS }
        # Reachable while impersonating, when the operator holds the target's roles rather
        # than their own. The route only redirects into Symfony's own exit handling.
        - { path: ^/impersonation/exit, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        # Pre-existing admin UI: category create/edit/delete, the last of which happens on a
        # GET. It predates this epic and was reachable by anyone who guessed the URL. Now that
        # the application has roles, leaving it open would make FR-010 true only of the pages
        # written after it.
        - { path: ^/videos/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/trainer, roles: ROLE_TRAINER }
        - { path: ^/coach, roles: ROLE_COACH }
        # FR-080/FR-081. Every parent and every child login holds ROLE_PLAYER, so this rule only
        # keeps strangers out; whose week a URL names is decided per request by
        # App\Availability\Security\AvailabilityVoter against the profiles the caller manages.
        - { path: ^/availability, roles: ROLE_PLAYER }
        - { path: ^/family, roles: ROLE_PLAYER }
        # FR-090/FR-095. Every parent and every child login holds ROLE_PLAYER, so this rule only
        # keeps strangers out; whose reservations a page shows is resolved per request from the
        # profiles the viewer is or manages, and whose purchase a URL names is decided by
        # App\Approval\Security\ApprovalVoter.
        - { path: ^/reservations, roles: ROLE_PLAYER }
        # FR-093. The inbox has no id in any route — both actions work on the current user's own
        # rows — so this rule is the whole of its authorization.
        - { path: ^/notifications, roles: ROLE_USER }
        # FR-069/FR-070. Any signed-in user may *ask* to switch context; which contexts they
        # actually hold is decided per request by TrainingContextResolver against their own
        # associations, and a pair they do not hold is a 403 there. A role rule cannot express
        # that — a parent and a child both hold ROLE_PLAYER.
        - { path: ^/context, roles: ROLE_USER }
        # NFR-066. Stored images are outside the web root and reach a browser only through
        # MediaController, which authorizes each one with the voter that owns the subject. This
        # rule only establishes that an anonymous visitor never gets that far.
        - { path: ^/media, roles: ROLE_USER }
        - { path: ^/account, roles: ROLE_USER }
        - { path: ^/dashboard, roles: ROLE_USER }
        # No catch-all rule: the pre-existing public pages (/videos, /products, /starships)
        # must stay reachable anonymously.

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
