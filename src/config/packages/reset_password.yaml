symfonycasts_reset_password:
    request_password_repository: App\Account\Repository\ResetPasswordRequestRepository

    # FR-004 / BR-003: a reset link is valid for one hour.
    lifetime: 3600

    # A user cannot request another reset inside this window (throttling comes free
    # with the bundle and complements the firewall's login_throttling).
    throttle_limit: 3600

    enable_garbage_collection: true
