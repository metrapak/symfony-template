# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false
    handle_all_throwables: true

    # Two security controls are keyed on the client IP — the firewall's login_throttling and
    # the verification_resend rate limiter — and both read it through Request::getClientIp().
    # Behind a load balancer or CDN that address is the proxy's unless the proxy is trusted
    # here, which would collapse every visitor into one shared bucket: three verification
    # resends per 15 minutes for the whole site, and one login-attempt counter for everyone.
    # Set SYMFONY_TRUSTED_PROXIES to the proxy's address or CIDR range in every environment
    # that has one (nginx talking to php-fpm over FastCGI is not one: it passes the real
    # REMOTE_ADDR through, so local development needs nothing).
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_httponly: true
        cookie_secure: auto
        cookie_samesite: lax
        # FR-002 asks for expiry after an inactivity period. Neither setting below delivers
        # that on its own, so they are backstops, not the mechanism:
        #   - gc_maxlifetime only makes a session *eligible* for collection; with the native
        #     handler, collection is probabilistic and often deferred to a system cron.
        #   - cookie_lifetime is an absolute cap from the moment the cookie was issued, so it
        #     also decides whether the session survives a browser restart — it is not an idle
        #     window, and a continuously active user is still cut off when it elapses.
        # The idle window users actually experience is enforced per request by
        # App\Account\Security\SessionIdleTimeoutSubscriber. All three read the same
        # app.session_idle_ttl parameter so they cannot silently disagree.
        cookie_lifetime: '%app.session_idle_ttl%'
        gc_maxlifetime: '%app.session_idle_ttl%'
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
