# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    iss_location_cache_ttl: 300
    videos_directory: '%kernel.project_dir%/public/uploads/videos'
    app.supported_locales:
        - en
        - fr
    app.locales_requirements: 'en|fr|'
    app.default_locale: en

    # FR-002 / Q-01.07 — authenticated session idle window, in seconds. The client has not
    # confirmed a duration; 7 days is the shipping default. Override per environment with
    # the SESSION_IDLE_TTL environment variable.
    app.session_idle_ttl_default: 604800
    app.session_idle_ttl: '%env(int:default:app.session_idle_ttl_default:SESSION_IDLE_TTL)%'

    # FR-005 / Q-01.05 — whether an unverified email blocks login. Enabled by default; the
    # gate applies to players and coaches only (see AccountStatusChecker), because trainers
    # and super admins are created by an administrator through a channel that already proves
    # email control. Override with the EMAIL_VERIFICATION_REQUIRED environment variable.
    app.email_verification_required_default: true
    app.email_verification_required: '%env(bool:default:app.email_verification_required_default:EMAIL_VERIFICATION_REQUIRED)%'

    # FR-031 / Q G-14 — how long an impersonation session may run before it is ended
    # automatically, in seconds. The spec fixes this at one hour; it is a parameter so an
    # environment that needs a shorter support window can tighten it without a deploy.
    app.impersonation_ttl_default: 3600
    app.impersonation_ttl: '%env(int:default:app.impersonation_ttl_default:IMPERSONATION_TTL)%'

    # NFR-066 — where uploaded images are written. Deliberately under var/ and not under
    # public/: nothing in this directory is reachable by URL, so every stored photo and logo is
    # served by a controller that has already decided who may see it. Override per environment
    # with the UPLOAD_ROOT environment variable.
    app.upload_root_default: '%kernel.project_dir%/var/uploads'
    app.upload_root: '%env(default:app.upload_root_default:UPLOAD_ROOT)%'

    # G-27 — the length of one block in every availability grid, in minutes. US-01.09 asks for
    # "hourly blocks or custom ranges", which are two different schemas; hourly blocks ship
    # (see App\Availability\Service\TimeGrid for the reasoning). Must divide 1440. Override with
    # the AVAILABILITY_SLOT_MINUTES environment variable — answering G-27 differently is a
    # configuration change, not a rewrite.
    app.availability_slot_minutes_default: 60
    app.availability_slot_minutes: '%env(int:default:app.availability_slot_minutes_default:AVAILABILITY_SLOT_MINUTES)%'

    # G-29 — the single time zone every stored availability minute is wall-clock time in. The
    # epic defines no time zone anywhere; this makes the assumption explicit and prints it on
    # every grid rather than leaving "Monday 17:00" to mean whatever the reader assumes.
    # Override with the AVAILABILITY_TIMEZONE environment variable.
    app.availability_timezone_default: 'UTC'
    app.availability_timezone: '%env(default:app.availability_timezone_default:AVAILABILITY_TIMEZONE)%'

    # Sender identity for transactional account mail. Override per environment with the
    # MAILER_SENDER_ADDRESS / MAILER_SENDER_NAME environment variables.
    app.mailer_sender_address_default: 'no-reply@example.com'
    app.mailer_sender_address: '%env(default:app.mailer_sender_address_default:MAILER_SENDER_ADDRESS)%'
    app.mailer_sender_name_default: 'Brainique'
    app.mailer_sender_name: '%env(default:app.mailer_sender_name_default:MAILER_SENDER_NAME)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            int $issLocationCacheTtl: '%iss_location_cache_ttl%'
            bool $emailVerificationRequired: '%app.email_verification_required%'
            int $sessionIdleTtl: '%app.session_idle_ttl%'
            int $impersonationTtl: '%app.impersonation_ttl%'
            string $senderAddress: '%app.mailer_sender_address%'
            string $senderName: '%app.mailer_sender_name%'
            string $uploadRoot: '%app.upload_root%'
            int $availabilitySlotMinutes: '%app.availability_slot_minutes%'
            string $availabilityTimezone: '%app.availability_timezone%'
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Domain/Entity/'
            - '../src/**/Domain/Enum/'
            - '../src/Availability/Entity/'
            - '../src/Availability/Enum/'
            - '../src/Availability/ValueObject/'
            - '../src/Account/Entity/'
            - '../src/Account/Enum/'
            - '../src/Account/Exception/'
            - '../src/Membership/Entity/'
            - '../src/Membership/Enum/'
            - '../src/Membership/Exception/'
            - '../src/Membership/ValueObject/'
            - '../src/Profile/Entity/'
            - '../src/Profile/Enum/'
            - '../src/Kernel.php'

#    App\Shared\Infrastructure\EventListener\ExceptionListener:
#        tags:
#          - { name: 'kernel.event_listener', event: 'kernel.exception', method: 'onException' }
#          - { name: 'kernel.event_listener', event: 'test.event', method: 'onTest' }

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Shared\Infrastructure\Controller\MainController:
        bind:
            $logger: '@monolog.logger.doctrine'